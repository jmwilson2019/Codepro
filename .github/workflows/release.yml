name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v3.5.0)"
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: grok-4agent-auditor/package-lock.json

      - name: Install dependencies
        working-directory: grok-4agent-auditor
        run: npm ci

      - name: Compile
        working-directory: grok-4agent-auditor
        run: npm run compile

      - name: Verify tag version matches package.json
        run: |
          PACKAGE_VERSION="$(node -p "require('./grok-4agent-auditor/package.json').version")"
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)." >&2
            exit 1
          fi

      - name: Package VSIX
        working-directory: grok-4agent-auditor
        run: npx --yes @vscode/vsce@latest package --no-dependencies -o ../grok-4agent-auditor-${{ env.RELEASE_TAG }}.vsix

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: grok-4agent-auditor-${{ env.RELEASE_TAG }}.vsix
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}

      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        working-directory: grok-4agent-auditor
        run: npx --yes @vscode/vsce@latest publish --packagePath ../grok-4agent-auditor-${{ env.RELEASE_TAG }}.vsix -p "$VSCE_PAT"

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        working-directory: grok-4agent-auditor
        run: npx --yes ovsx publish ../grok-4agent-auditor-${{ env.RELEASE_TAG }}.vsix -p "$OVSX_PAT"
